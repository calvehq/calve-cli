# cargo-deny policy (CI `deny` job). The license allowlist mirrors `xtask licenses`
# (xtask/src/release.rs ALLOWED), which gates every release build per target.

[graph]
all-features = false

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[advisories]
# Unsound advisories count for every dependency, not only direct ones (lru 0.12.5 via
# ratatui 0.28 was caught this way in M5 and removed by moving to ratatui 0.30).
unsound = "all"
# Every advisory fails the job; an exception needs an entry here with a reason.
ignore = [
    # Bundled SQLite < 3.54 (libsqlite3-sys 0.35 via rusqlite 0.37). OpenAEVC v0.1.0 requires
    # rusqlite 0.37 and only one crate may link sqlite3, so Calve cannot move alone. Owner-accepted
    # 2026-11-11 while Calve stays on OpenAEVC v0.1.0; remove with a release on rusqlite >= 0.41.
    { id = "RUSTSEC-2026-0459", reason = "fixed only past OpenAEVC v0.1.0's rusqlite 0.37; owner-accepted until an OpenAEVC release moves to rusqlite >= 0.41" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# OpenAEVC v0.1.0 is fetched from its public tag (ADR 0003).
allow-git = ["https://github.com/calvehq/openaevc.git"]
