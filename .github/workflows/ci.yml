name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # OpenAEVC v0.1.0 is fetched from its public tag over HTTPS: no SSH key or secret (ADR 0003).
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo run --locked -p xtask -- check-architecture
      - run: cargo test --locked -p xtask
      - run: cargo run --locked -p xtask -- check-isolation
      - run: cargo run --locked -p xtask -- cli-reference --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
