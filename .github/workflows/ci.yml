name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly, so advisories, link rot and toolchain drift surface without a commit.
    - cron: "17 4 * * 1"

# Actions are pinned to commits (tag in the comment).
permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # OpenAEVC v0.1.0 is fetched from its public tag over HTTPS: no SSH key or secret (ADR 0003).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
        if: runner.os == 'Linux'
      - run: cargo run --locked -p xtask -- check-architecture
      - run: cargo test --locked -p xtask
      - run: cargo run --locked -p xtask -- check-isolation
      - run: cargo run --locked -p xtask -- cli-reference --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Windows integration tests share named resources; one at a time (M4/M5 isolation notes).
      - run: cargo test --locked --workspace -- --test-threads 1
        if: runner.os == 'Windows'
      - run: cargo test --locked --workspace
        if: runner.os != 'Windows'

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

  licenses:
    # The release gate itself: every shipped dependency, per release target.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: |
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin \
                   aarch64-apple-darwin x86_64-pc-windows-msvc; do
            cargo run --locked -q -p xtask -- licenses --target "$t"
          done

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --exclude-path target "./**/*.md"
          fail: true
